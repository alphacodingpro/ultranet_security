name: Deploy Website via FTP

on:
  push:
    branches:
      - main  # Agar branch master hai to master likhein

jobs:
  web-deploy:
    name: Deploying to cPanel
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
    
    - name: PHP syntax gate
      run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

    - name: Sync files to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./
        # Niche wali lines aapki files aur folders ko cPanel par update hone se bachayengi:
        exclude: |
          .env
          **/uploads/products**
          **/img/**
          **/assets/img/**
          **/.git*
          **/.git*/**
          **/tests/**
          **/tools/**
          **/node_modules/**
          **/.DS_Store
          seo-live-audit.json

    - name: Live SEO crawl after deployment
      run: python3 tools/seo-live-audit.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: live-seo-audit
        path: seo-live-audit.json
