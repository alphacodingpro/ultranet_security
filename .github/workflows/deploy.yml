name: Deploy Website via FTP

on:
  push:
    branches:
      - main  # Agar branch master hai to master likhein

jobs:
  web-deploy:
    name: Deploying to cPanel
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
    
    - name: Sync files to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./
        # Niche wali lines aapki files aur folders ko cPanel par update hone se bachayengi:
        sync-ignored: |
          .env
          **/uploads/products**
          **/img/**
          **/assets/img/**
          .git/
          .github/
