name: Budget package checks
on:
  push:
    branches: [main, codex/budget-packages]
  pull_request:
permissions:
  contents: read
jobs:
  budget-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l includes/budget-package.php
          php -l includes/calculator-budget-form.php
          php -l calculator-budget.php
          php -l calculator.php
          php -l calculator-submit.php
          php -l admin/calculator-budget-products.php
          php -l admin/calculator-settings.php
      - name: Package selection regressions
        run: php tests/budget-package-test.php
      - name: JavaScript syntax
        run: node --check assets/js/calculator-budget.js
